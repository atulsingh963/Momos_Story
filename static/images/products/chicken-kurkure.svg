<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="momoKurkure" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#plateGrad)" stroke="#EAB308" stroke-width="4" filter="url(#shadow)"/>

  <g filter="url(#shadow)" transform="translate(0, 10)">
    <path d="M 120 230 C 100 160, 160 110, 200 110 C 240 110, 300 160, 280 230 C 260 280, 140 280, 120 230 Z" fill="url(#momoKurkure)" stroke="#713F12" stroke-width="4"/>
    
    <!-- Crunchy flakes around edges -->
    <path d="M 130 180 L 120 175 L 125 190 Z" fill="#FACC15"/>
    <path d="M 270 180 L 280 175 L 275 190 Z" fill="#FACC15"/>
    <path d="M 160 130 L 155 120 L 170 125 Z" fill="#FACC15"/>
    <path d="M 240 130 L 245 120 L 230 125 Z" fill="#FACC15"/>
    <path d="M 180 260 L 185 270 L 195 262 Z" fill="#FACC15"/>

    <circle cx="200" cy="110" r="12" fill="#B42318"/>
  </g>

  <circle cx="290" cy="110" r="35" fill="#B42318" stroke="#FFF7ED" stroke-width="2"/>
  <circle cx="290" cy="110" r="28" fill="#7F1D1D"/>

  <text x="200" y="340" fill="#FACC15" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">EXTRA CRISPY</text>
</svg>
