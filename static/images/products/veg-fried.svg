<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="momoFried" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="60%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#plateGrad)" stroke="#F97316" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="8 6"/>

  <g filter="url(#shadow)" transform="translate(0, 10)">
    <path d="M 120 230 C 100 160, 160 110, 200 110 C 240 110, 300 160, 280 230 C 260 280, 140 280, 120 230 Z" fill="url(#momoFried)" stroke="#7C2D12" stroke-width="3"/>
    
    <path d="M 140 220 Q 200 120 200 110" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 170 240 Q 200 120 200 110" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 250 Q 200 130 200 110" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 230 240 Q 200 120 200 110" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 260 220 Q 200 120 200 110" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="200" cy="110" r="12" fill="#B42318"/>
  </g>

  <circle cx="290" cy="110" r="35" fill="#B42318" stroke="#FFF7ED" stroke-width="2"/>
  <circle cx="290" cy="110" r="28" fill="#7F1D1D"/>
  <circle cx="285" cy="105" r="4" fill="#F97316"/>

  <!-- Crispy texture flecks -->
  <circle cx="160" cy="180" r="3" fill="#FACC15"/>
  <circle cx="220" cy="190" r="4" fill="#FACC15"/>
  <circle cx="190" cy="220" r="3" fill="#FACC15"/>
  <circle cx="240" cy="170" r="3" fill="#FACC15"/>
</svg>
