<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="momoTandoori" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="60%" stop-color="#B42318"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#plateGrad)" stroke="#B42318" stroke-width="4" filter="url(#shadow)"/>

  <g filter="url(#shadow)" transform="translate(0, 10)">
    <path d="M 120 230 C 100 160, 160 110, 200 110 C 240 110, 300 160, 280 230 C 260 280, 140 280, 120 230 Z" fill="url(#momoTandoori)" stroke="#450A0A" stroke-width="3"/>
    
    <!-- Char Marks -->
    <path d="M 160 170 Q 180 180 170 190" fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 210 150 Q 230 160 220 180" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M 190 220 Q 210 230 200 240" fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <circle cx="200" cy="110" r="12" fill="#B42318"/>
  </g>

  <!-- Green Mint Chutney Bowl -->
  <circle cx="290" cy="110" r="35" fill="#15803D" stroke="#FFF7ED" stroke-width="2"/>
  <circle cx="290" cy="110" r="28" fill="#166534"/>

  <!-- Smoke / Grill indicator -->
  <path d="M 180 70 Q 170 50 185 30" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 210 60 Q 225 40 210 20" fill="none" stroke="#B42318" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
