<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="momoBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="70%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Plate -->
  <circle cx="200" cy="200" r="180" fill="url(#plateGrad)" stroke="#B42318" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Momo Group -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Central Momo Body -->
    <path d="M 120 230 C 100 160, 160 110, 200 110 C 240 110, 300 160, 280 230 C 260 280, 140 280, 120 230 Z" fill="url(#momoBody)" stroke="#C2410C" stroke-width="3"/>
    
    <!-- Pleats / Folds -->
    <path d="M 140 220 Q 200 120 200 110" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 170 240 Q 200 120 200 110" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 250 Q 200 130 200 110" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 230 240 Q 200 120 200 110" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 260 220 Q 200 120 200 110" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top Crown Pinch -->
    <circle cx="200" cy="110" r="12" fill="#B42318"/>
  </g>

  <!-- Spicy Chutney Bowl -->
  <circle cx="290" cy="110" r="35" fill="#B42318" stroke="#FFF7ED" stroke-width="2"/>
  <circle cx="290" cy="110" r="28" fill="#7F1D1D"/>
  <circle cx="285" cy="105" r="4" fill="#F97316"/>
  <circle cx="295" cy="118" r="3" fill="#FACC15"/>

  <!-- Steam lines -->
  <path d="M 170 80 Q 160 60 175 40" fill="none" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 200 70 Q 215 50 200 30" fill="none" stroke="#FFF7ED" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 230 80 Q 240 60 225 40" fill="none" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Chili garnish -->
  <path d="M 100 120 Q 80 140 100 160" fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
</svg>
